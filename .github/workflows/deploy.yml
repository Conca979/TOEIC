name: Deploy Static TOEIC App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble static site artifact
        run: |
          mkdir -p _site/extracted "_site/Hacker 3/AUDIO"
          cp index.html styles.css app.js _site/
          touch _site/.nojekyll
          cp extracted/index.json _site/extracted/
          for dir in extracted/test-*; do
            name=$(basename "$dir")
            mkdir -p "_site/extracted/$name/images"
            cp "$dir/test.json" "_site/extracted/$name/"
            cp -r "$dir/images/." "_site/extracted/$name/images/"
          done
          cp "Hacker 3/AUDIO/"*.mp3 "_site/Hacker 3/AUDIO/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
